<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ScriptCutAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ScriptCutAI</h1>
            <div class="status-indicator" id="serverStatus">
                <span class="status-dot"></span>
                <span class="status-text">Checking server...</span>
            </div>
        </div>

        <!-- Step 1: Video Selection -->
        <div class="section">
            <div class="section-header">
                <span class="step-number">1</span>
                <span class="step-title">Video File</span>
            </div>
            <div class="section-content">
                <div class="file-path" id="videoPath">
                    No video selected
                </div>
                <button class="btn btn-secondary" id="btnSelectVideo">
                    Get from Timeline
                </button>
            </div>
        </div>

        <!-- Step 2: Script Input -->
        <div class="section">
            <div class="section-header">
                <span class="step-number">2</span>
                <span class="step-title">Script Text</span>
            </div>
            <div class="section-content">
                <textarea id="scriptText" placeholder="Paste the script that was supposed to be read..."></textarea>
            </div>
        </div>

        <!-- Step 3: Analyze -->
        <div class="section">
            <div class="section-header">
                <span class="step-number">3</span>
                <span class="step-title">Analyze & Cut</span>
            </div>
            <div class="section-content">
                <div class="model-select">
                    <label>Whisper Model:</label>
                    <select id="whisperModel">
                        <option value="tiny">Tiny (fastest)</option>
                        <option value="base" selected>Base (balanced)</option>
                        <option value="small">Small (better)</option>
                        <option value="medium">Medium (best)</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btnAnalyze">
                    Analyze Video
                </button>
            </div>
        </div>

        <!-- Progress -->
        <div class="section" id="progressSection" style="display: none;">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">Analyzing...</div>
        </div>

        <!-- Results -->
        <div class="section" id="resultsSection" style="display: none;">
            <div class="section-header">
                <span class="step-number">✓</span>
                <span class="step-title">Results</span>
            </div>
            <div class="section-content">
                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="statKeep">0:00</span>
                        <span class="stat-label">Keep</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statRemove">0:00</span>
                        <span class="stat-label">Remove</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statReduction">0%</span>
                        <span class="stat-label">Reduction</span>
                    </div>
                </div>
                <button class="btn btn-success" id="btnApplyCuts">
                    Apply Cuts to Timeline
                </button>
                <button class="btn btn-secondary" id="btnPreview">
                    Preview Cuts
                </button>
            </div>
        </div>

        <!-- Log -->
        <div class="log-container">
            <div class="log-header">Log</div>
            <div class="log-content" id="logContent"></div>
        </div>
    </div>

    <!-- CSInterface -->
    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
